# OpenAudible Docker (hardened) - generic Docker Compose file.
#
# 1. cp .env.example .env   and set OA_PASSWORD (required) and OA_DATA_DIR
# 2. docker compose up -d
# 3. open https://localhost:3001  (self-signed certificate on first use)
#
# Platform guides: TRUENAS.md, SYNOLOGY.md. Hardening rationale: SECURITY.md.

services:
  openaudible:
    image: ghcr.io/aoboturov/openaudible_docker:latest
    # Or build locally:  docker compose build
    build: .
    container_name: openaudible

    ports:
      # HTTPS web desktop. The base image serves a self-signed cert unless you
      # drop cert.pem / cert.key into <OA_DATA_DIR-parent>/ssl (see SECURITY.md).
      - "${OA_HTTPS_PORT:-3001}:3001"
      # Plain HTTP. Only enable behind a TLS-terminating reverse proxy on a
      # private network; the VNC password and clipboard travel in clear text.
      # - "127.0.0.1:3000:3000"

    volumes:
      - ${OA_DATA_DIR:-./openaudible_data}:/config/OpenAudible
      # Optional: your own TLS certificate and key for port 3001.
      # - ./ssl:/config/ssl:ro
      # Optional: import existing audiobooks (read-only).
      # - /path/to/existing/audiobooks:/import/existing:ro

    environment:
      # REQUIRED. The container refuses to start without it unless
      # OA_ALLOW_NO_PASSWORD=true is set on purpose.
      - PASSWORD=${OA_PASSWORD:?Set OA_PASSWORD in .env}
      # Alternative: read the password from a Docker secret file.
      # - FILE__PASSWORD=/run/secrets/openaudible_password

      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}

      # OpenAudible version policy. The image ships a pinned, checksum-verified
      # build. Leave OA_AUTO_UPGRADE unset to keep it. To re-pin at runtime:
      #   - OA_AUTO_UPGRADE=true
      #   - OA_VERSION=5.0.1
      #   - OA_SHA256_X86_64=<sha256>   (and/or OA_SHA256_AARCH64)
      # Unverified "latest"/beta downloads need OA_ALLOW_UNVERIFIED=true.
      - OA_BETA=false

      # Internal WebKit browser compatibility (software rendering).
      - WEBKIT_DISABLE_DMABUF_RENDERER=1
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - WEBKIT_FORCE_SOFTWARE_RENDERING=1
      - GDK_GL=disable

      - KASM_AUDIO_ENABLED=1
      - OA_KIOSK=true
      - oa_internal_browser=true

    # Least privilege. The linuxserver init needs these to create user abc and
    # chown /config; nothing else is required.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus unprivileged user namespaces, which
      # WebKitGTK's sandbox needs. If OpenAudible does not auto-start, try the
      # ladder in SECURITY.md before falling back to seccomp:unconfined.
      - seccomp:./seccomp/openaudible.json

    pids_limit: 2048
    mem_limit: 4g
    restart: unless-stopped

    # Example Docker secret for the password (uncomment FILE__PASSWORD above):
    # secrets:
    #   - openaudible_password

# secrets:
#   openaudible_password:
#     file: ./openaudible_password.txt
